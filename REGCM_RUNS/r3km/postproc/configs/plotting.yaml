plotting:
  visuals:
    dpi: 300
    format: "png"
    figsize_map: [14, 6]
    figsize_ts: [10, 5]
    style: "seaborn-whitegrid"
    colors:
      model: "#E63946"
      obs: "#457B9D"
    font_family: "sans-serif"
    title_size: 16
    panel_title_size: 14
    axis_label_size: 12
    tick_label_size: 10
    colorbar_label_size: 12
    legend_size: 10
    panel_label_size: 14

  maps:
    projection: "PlateCarree"
    coastlines:
      enabled: true
      linewidth: 0.7
    borders:
      enabled: true
      linewidth: 0.5
    gridlines:
      enabled: true
      linestyle: ":"
      linewidth: 0.3
      alpha: 0.5
    evaluation_buffer_degrees: 0.75
    background: "neutral"
    mask_outside_region: true

  variables:
    pr:
      cmap: "YlGnBu"
      cmap_bias: "BrBG"
      climatology:
        type: "discrete"
        levels: [0, 0.25, 0.5, 1, 2, 3, 5, 7.5, 10]
        extend: "max"
      bias:
        type: "discrete"
        levels: [-5, -3, -2, -1, -0.5, 0, 0.5, 1, 2, 3, 5]
        center_zero: true
        extend: "both"
    tasmax:
      cmap: "RdYlBu_r"
      cmap_bias: "RdBu_r"
      climatology:
        type: "discrete"
        levels: [5, 10, 15, 20, 25, 30, 35, 40, 45]
        extend: "both"
      bias:
        type: "discrete"
        levels: [-8, -6, -4, -3, -2, -1, 0, 1, 2, 3, 4, 6, 8]
        center_zero: true
        extend: "both"
    tasmin:
      cmap: "RdYlBu_r"
      cmap_bias: "RdBu_r"
      climatology:
        type: "discrete"
        levels: [-5, 0, 5, 10, 15, 20, 25, 30, 35]
        extend: "both"
      bias:
        type: "discrete"
        levels: [-8, -6, -4, -3, -2, -1, 0, 1, 2, 3, 4, 6, 8]
        center_zero: true
        extend: "both"
    elevation:
      cmap: "terrain"
      type: "discrete"
      levels: [0, 250, 500, 1000, 1500, 2000, 2500, 3000, 4000]
      extend: "max"
